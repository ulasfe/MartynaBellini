<div class="dashboard-container">
  <div class="welcome-card">
    <div class="icon-circle">
      <i class="fas fa-user-shield"></i>
    </div>
    <h1>Welcome back, Admin!</h1>
    <p>You have successfully logged into the <b>Order Management System</b>. From here, you can manage orders, track inventory, and view reports.</p>
    
    <div class="stats-grid">
      <div class="stat-item">
        <span class="label">Status</span>
        <span class="value online">Online</span>
      </div>
      <div class="stat-item">
        <span class="label">System Time</span>
        <span class="value">{{ currentTime | date:'shortTime' }}</span>
      </div>
    </div>

    <button (click)="logout()" class="logout-btn">Logout</button>
  </div>
</div>
